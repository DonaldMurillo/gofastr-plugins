<!doctype html>
<!--
  GoFastr form builder — opaque-origin sandboxed frame document (protocol v1).

  Served same-origin at /__gofastr/plugin/formbuilder/builder.html and loaded
  inside an <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under that
  sandbox:
    - the frame is an opaque origin; document.cookie / localStorage /
      sessionStorage throw, and window.parent.document is unreachable.
    - the framed CSP sets connect-src 'none': the frame can NEVER save the
      schema itself. Every save crosses the postMessage bridge to the host,
      which validates the schema in Go and either persists it or refuses
      with a specific error code — which is the point of this plugin.
  Sub-resources are referenced by RELATIVE path so they resolve under the
  plugin asset route prefix regardless of the host-appended ?v= cache-buster.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Form builder</title>
    <link rel="stylesheet" href="./builder.css" />
  </head>
  <body>
    <div id="fb-root" role="region" aria-label="Form schema builder">
      <div class="fb-toolbar">
        <div id="fb-palette" class="fb-palette" role="group" aria-label="Add a field"></div>
        <span id="fb-count" class="fb-count" aria-live="polite">0 fields · 0 rules</span>
      </div>
      <div class="fb-main">
        <ol id="fb-list" class="fb-list" aria-label="Form fields"></ol>
        <div id="fb-props" class="fb-props" aria-label="Field properties"></div>
      </div>
      <ul id="fb-warn" class="fb-warn" hidden></ul>
      <div class="fb-footer">
        <span id="fb-status" class="fb-status" aria-live="polite">Loading…</span>
        <button type="button" id="fb-save" class="fb-save">Save schema</button>
      </div>
    </div>
    <!--
      The ?v= on the iframe SRC is a host-appended cache-buster for
      builder.html; sub-resource references stay relative and do not depend
      on its value. The bundle is the ONLY script (CSP script-src 'self');
      no inline JS anywhere in this document.
    -->
    <script src="./builder.js"></script>
  </body>
</html>
