<!doctype html>
<!--
  GoFastr PDF viewer — opaque-origin sandboxed frame document
  (protocol v1, schema pdf-v1).

  Served same-origin at /__gofastr/plugin/pdf/viewer.html and loaded inside
  an <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under that sandbox:
    - the frame is an opaque origin; document.cookie / localStorage /
      sessionStorage throw, and window.parent.document is unreachable.
    - the framed CSP is FIXED by gofastr core (pluginhost.framedCSP):
        sandbox allow-scripts
        ; default-src   <origin>
        ; script-src    <origin>
        ; style-src     <origin> 'unsafe-inline'
        ; img-src       <origin> data:
        ; font-src      <origin> data:
        ; connect-src   'none'
        ; frame-ancestors <origin>
        ; base-uri      <origin>
      Consequences:
        * connect-src 'none' => NO fetch/XHR/WebSocket. The PDF bytes arrive
          over the postMessage bridge (host adapter fetches same-origin,
          forwards the ArrayBuffer). pdf.js cannot fetch standard fonts or
          cMaps either.
        * no blob: source => blob: Web Workers are CSP-blocked (worker-src
          falls back to default-src <origin>), so pdf.js runs WORKER-FREE on
          the main thread (globalThis.pdfjsWorker.WorkerMessageHandler).
        * script-src <origin> (no 'unsafe-eval') => fine; pdf.js v6 uses no
          eval; the no-wasm JPX/JBIG2 fallbacks are statically inlined by
          build.mjs.
    - the ONLY host channel is window.parent.postMessage. viewer.js never
      touches host DOM, cookies, or storage.

  The entire viewer UI (toolbar, sidebar, scroll, page canvases, text/annotation
  layers) is built imperatively by viewer.js into #pdf-root. This document is
  intentionally minimal: a mount point + the single bundled script.

  Sub-resources are referenced by RELATIVE path so they resolve under the plugin
  asset route prefix regardless of the host-appended ?v= cache-buster.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>PDF viewer</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <div id="pdf-root" role="region" aria-label="PDF document viewer"></div>
    <!--
      The ?v= on the iframe SRC is a host-appended cache-buster for viewer.html;
      sub-resource references stay relative and do not depend on its value. The
      bundle is the ONLY script: no inline JS (CSP script-src <origin>), the
      entire pdfjs-dist library + worker is bundled in.
    -->
    <script src="./viewer.js"></script>
  </body>
</html>
