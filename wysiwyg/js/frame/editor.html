<!doctype html>
<!--
  GoFastr WYSIWYG editor — opaque-origin sandboxed frame document (protocol v1).

  Served same-origin at /__gofastr/plugin/wysiwyg/editor.html and loaded inside an
  <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under that sandbox:
    - the frame is an opaque origin; document.cookie / localStorage / sessionStorage
      throw, and window.parent.document is unreachable.
    - the ONLY host channel is window.parent.postMessage. editor.js never touches
      host DOM, cookies, or storage.
  Sub-resources are referenced by RELATIVE path so they resolve under the plugin
  asset route prefix regardless of the host-appended ?v= cache-buster.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WYSIWYG editor</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <!-- ProseMirror mounts its contenteditable inside this root. -->
    <div id="editor" class="wysiwyg-root" role="region" aria-label="Rich text editor"></div>
    <!--
      The ?v= on the iframe SRC is a host-appended cache-buster for editor.html;
      sub-resource references stay relative and do not depend on its value.
    -->
    <script src="./editor.js"></script>
  </body>
</html>
