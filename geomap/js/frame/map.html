<!doctype html>
<!--
  GoFastr Leaflet map — opaque-origin sandboxed frame document (protocol v1).

  Served same-origin at /__gofastr/plugin/map/map.html and loaded inside an
  <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under that sandbox:
    - the frame is an opaque origin; document.cookie / localStorage /
      sessionStorage throw, and window.parent.document is unreachable.
    - the ONLY host channel is window.parent.postMessage. map.js never touches
      host DOM, cookies, or storage.
  Sub-resources are referenced by RELATIVE path so they resolve under the plugin
  asset route prefix regardless of the host-appended ?v= cache-buster.

  Tiles: Leaflet's L.tileLayer points at the SAME-ORIGIN proxy
  /__gofastr/plugin/map/tiles/{provider}/{z}/{x}/{y}. The framed CSP
  (img-src <origin> data:) blocks external tile hosts; the proxy fetches
  upstream server-side from a fixed allowlist (the SSRF guard). connect-src
  'none' does not matter for raster tiles (they are <img>, not fetch).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Leaflet map</title>
    <link rel="stylesheet" href="./map.css" />
  </head>
  <body>
    <div id="map-container" role="region" aria-label="Interactive map"></div>
    <!--
      Non-blocking status line surfaced on a failed save (esp. a 409 conflict
      relayed by the host adapter's saveResult). Empty + inert on success.
    -->
    <div id="map-status" class="map-status" aria-live="polite"></div>
    <!--
      The ?v= on the iframe SRC is a host-appended cache-buster for map.html;
      sub-resource references stay relative and do not depend on its value.
      The bundle is the ONLY script: no inline JS (CSP script-src 'self'),
      Leaflet is bundled in.
    -->
    <script src="./map.js"></script>
  </body>
</html>
