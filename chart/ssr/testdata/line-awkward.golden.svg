.gofastr-chart-s2{color:var(--gcc-success)}
.gofastr-chart-s3{color:var(--gcc-accent)}
.gofastr-chart-s4{color:var(--gcc-danger)}
.gofastr-chart-s5{color:color-mix(in srgb,var(--gcc-info) 55%,var(--gcc-text))}
