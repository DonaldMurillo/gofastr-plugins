<!doctype html>
<!--
  GoFastr data grid — opaque-origin sandboxed frame document (protocol v1).

  Served same-origin at /__gofastr/plugin/datagrid/grid.html and loaded inside
  an <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under that sandbox:
    - the frame is an opaque origin; document.cookie / localStorage /
      sessionStorage throw, and window.parent.document is unreachable.
    - the framed CSP sets connect-src 'none': the frame can NEVER fetch its
      own rows. Every page arrives from the host over the postMessage bridge
      as a correlated requestRows → rowsResult pair — which is the point of
      this plugin.
  Sub-resources are referenced by RELATIVE path so they resolve under the
  plugin asset route prefix regardless of the host-appended ?v= cache-buster.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Data grid</title>
    <link rel="stylesheet" href="./grid.css" />
  </head>
  <body>
    <div id="datagrid-root" role="region" aria-label="Data grid">
      <div class="dg-toolbar">
        <input id="dg-filter" type="search" placeholder="Filter rows — server-side"
          aria-label="Filter rows (applied by the host)" />
        <span id="dg-count" class="dg-count" aria-live="polite">Loading…</span>
        <span id="dg-status" class="dg-status" aria-live="polite"></span>
        <button type="button" id="dg-export" class="dg-export" hidden>Export CSV</button>
      </div>
      <div id="datagrid-grid" class="dg-grid"></div>
    </div>
    <!--
      The ?v= on the iframe SRC is a host-appended cache-buster for
      grid.html; sub-resource references stay relative and do not depend on
      its value. The bundle is the ONLY script: no inline JS (CSP script-src
      'self'), AG Grid Community is bundled in.
    -->
    <script src="./grid.js"></script>
  </body>
</html>
