<!doctype html>
<!--
  GoFastr Mermaid diagram editor — opaque-origin sandboxed frame document
  (protocol v1).

  Served same-origin at /__gofastr/plugin/mermaid/diagram.html and loaded inside
  an <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under that sandbox:
    - the frame is an opaque origin; document.cookie / localStorage /
      sessionStorage throw, and window.parent.document is unreachable.
    - the ONLY host channel is window.parent.postMessage. diagram.js never
      touches host DOM, cookies, or storage.
  Sub-resources are referenced by RELATIVE path so they resolve under the plugin
  asset route prefix regardless of the host-appended ?v= cache-buster.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mermaid diagram editor</title>
    <link rel="stylesheet" href="./diagram.css" />
  </head>
  <body>
    <div id="mermaid-root" role="region" aria-label="Mermaid diagram editor">
      <textarea id="mermaid-source" spellcheck="false"
        aria-label="Mermaid diagram source" placeholder="graph TD&#10;    A --> B"></textarea>
      <div id="mermaid-preview" aria-label="Rendered diagram"></div>
    </div>
    <!--
      The ?v= on the iframe SRC is a host-appended cache-buster for
      diagram.html; sub-resource references stay relative and do not depend on
      its value. The bundle is the ONLY script: no inline JS (CSP script-src
      'self'), the Mermaid library is bundled in.
    -->
    <script src="./diagram.js"></script>
  </body>
</html>
