<!doctype html>
<!--
  GoFastr SQL notebook — opaque-origin sandboxed frame document
  (sqlnotebook protocol v1, schema sqlnotebook.v1).

  Served same-origin at /__gofastr/plugin/sqlnotebook/frame.html and loaded
  inside an <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under
  that sandbox:
    - the frame is an opaque origin; document.cookie / localStorage /
      sessionStorage throw, and window.parent.document is unreachable.
    - the framed CSP sets connect-src 'none': the frame can NEVER fetch.
      That includes the engine: sql.js's documented `locateFile` option
      makes it fetch sql-wasm.wasm over HTTP, which fails with "both async
      and sync fetching of the wasm failed". The .wasm bytes therefore
      arrive over the postMessage bridge (the HOST adapter fetches
      same-origin and posts sqlnb/init with the ArrayBuffer), and this
      frame calls initSqlJs({ wasmBinary }) — never locateFile.
    - sql-wasm.js itself (the emscripten JS glue) IS loadable as a plain
      <script src> from the frame's own origin; only the .wasm needs
      delivering as bytes.
    - wasm needs 'wasm-unsafe-eval' in the SERVED CSP — the Go side hands
      the manifest CSP to the AssetServer; that is its half of the
      contract, not this document's.

  The build inlines notebook.css into a <style> block in the committed
  assets/frame.html (this source keeps the <link> so it renders standalone
  under js/frame/). Sub-resources are referenced by RELATIVE path so they
  resolve under the plugin asset route prefix regardless of the
  host-appended ?v= cache-buster.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SQL notebook</title>
    <style>
/*
 * GoFastr SQL notebook — TOKEN-ONLY frame stylesheet (sqlnotebook protocol v1).
 *
 * Every color/spacing/radius/font resolves from a --color-*/--spacing-*/…
 * custom property the HOST bridges in via init/themeChanged (notebook.ts
 * writes a :root{} block from params.tokens). This file deliberately does
 * NOT declare any --color-* itself: before the bridge lands, the var()
 * fallbacks below carry the rendering, and after it lands the bridged
 * values win by being the only definition. That makes the notebook legible
 * in BOTH light and dark schemes by construction — the palette flips with
 * the host, never here. No prefers-color-scheme gating: theme is
 * host-driven (the host re-resolves and re-sends tokens on a scheme flip).
 */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--font-body, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  font-size: var(--text-sm, 0.875rem);
  color: var(--color-text, #18181b);
  background: var(--color-background, #ffffff);
  -webkit-font-smoothing: antialiased;
}

#sqlnb-root {
  display: grid;
  grid-template-columns: minmax(160px, 220px) 1fr;
  gap: var(--spacing-md, 12px);
  height: 100%;
  padding: var(--spacing-md, 12px);
  background: var(--color-background, #ffffff);
}

/* ---- schema sidebar ---- */

.sqlnb-side {
  border: 1px solid var(--color-border, #e4e4e7);
  border-radius: var(--radii-md, 10px);
  background: var(--color-surface, #ffffff);
  overflow: auto;
  padding: var(--spacing-sm, 8px);
}

.sqlnb-side-title {
  font-size: var(--text-xs, 0.75rem);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--color-text-subtle, #71717a);
  padding: var(--spacing-xs, 4px) var(--spacing-xs, 4px) var(--spacing-sm, 8px);
}

.sqlnb-tables details {
  border-top: 1px solid var(--color-border, #e4e4e7);
}

.sqlnb-tables details:first-child {
  border-top: 0;
}

.sqlnb-tables summary {
  cursor: pointer;
  padding: var(--spacing-xs, 4px) var(--spacing-xs, 4px);
  font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  font-size: var(--text-xs, 0.75rem);
  color: var(--color-text, #18181b);
  list-style-position: inside;
}

.sqlnb-tables summary:hover {
  color: var(--color-primary, #6366f1);
}

.sqlnb-tables ul {
  list-style: none;
  margin: 0;
  padding: 0 0 var(--spacing-xs, 4px) var(--spacing-lg, 16px);
}

.sqlnb-tables li {
  font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  font-size: var(--text-xs, 0.75rem);
  color: var(--color-text-muted, #52525b);
  padding: 1px 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sqlnb-tables .sqlnb-col-type {
  color: var(--color-text-subtle, #71717a);
}

.sqlnb-tables .sqlnb-col-pk {
  margin-inline-start: 6px;
  padding: 0 4px;
  border: 1px solid var(--color-border, #E4E4E7);
  border-radius: var(--radii-sm, 4px);
  font-size: 0.72em;
  letter-spacing: 0.04em;
  color: var(--color-text-subtle, #71717A);
  font-weight: 600;
}

/* ---- editor + results ---- */

.sqlnb-main {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm, 8px);
  min-width: 0;
}

.sqlnb-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm, 8px);
}

#sqlnb-run {
  font: inherit;
  font-weight: 600;
  color: var(--color-primary-fg, #ffffff);
  background: var(--color-primary, #6366f1);
  border: 1px solid transparent;
  border-radius: var(--radii-sm, 6px);
  padding: var(--spacing-xs, 4px) var(--spacing-lg, 16px);
  cursor: pointer;
}

#sqlnb-run:hover {
  background: var(--color-accent, #4f46e5);
}

#sqlnb-run:disabled {
  opacity: 0.5;
  cursor: default;
}

.sqlnb-status {
  font-size: var(--text-xs, 0.75rem);
  color: var(--color-text-subtle, #71717a);
}

.sqlnb-sql {
  font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  font-size: var(--text-sm, 0.875rem);
  line-height: 1.5;
  color: var(--color-code-text, var(--color-text, #18181b));
  background: var(--color-code-surface, var(--color-surface-soft, #f4f4f5));
  border: 1px solid var(--color-code-border, var(--color-border, #e4e4e7));
  border-radius: var(--radii-sm, 6px);
  padding: var(--spacing-sm, 8px);
  resize: vertical;
  min-height: 6em;
  width: 100%;
}

.sqlnb-sql:focus {
  outline: 2px solid var(--color-primary, #6366f1);
  outline-offset: -1px;
}

.sqlnb-error {
  font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  font-size: var(--text-xs, 0.75rem);
  color: var(--color-danger, #dc2626);
  background: var(--color-surface, #ffffff);
  border: 1px solid var(--color-danger, #dc2626);
  border-radius: var(--radii-sm, 6px);
  padding: var(--spacing-sm, 8px);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.sqlnb-result {
  flex: 1;
  overflow: auto;
  border: 1px solid var(--color-border, #e4e4e7);
  border-radius: var(--radii-sm, 6px);
  background: var(--color-surface, #ffffff);
}

.sqlnb-hint {
  padding: var(--spacing-sm, 8px);
  font-size: var(--text-xs, 0.75rem);
  color: var(--color-text-subtle, #71717a);
}

.sqlnb-result table {
  border-collapse: collapse;
  width: 100%;
  font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  font-size: var(--text-xs, 0.75rem);
}

.sqlnb-result th,
.sqlnb-result td {
  border-bottom: 1px solid var(--color-border, #e4e4e7);
  border-right: 1px solid var(--color-border, #e4e4e7);
  padding: var(--spacing-xs, 4px) var(--spacing-sm, 8px);
  text-align: left;
  white-space: nowrap;
  max-width: 40ch;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sqlnb-result th:last-child,
.sqlnb-result td:last-child {
  border-right: 0;
}

.sqlnb-result tr:last-child td {
  border-bottom: 0;
}

.sqlnb-result thead th {
  position: sticky;
  top: 0;
  background: var(--color-surface-soft, #f4f4f5);
  color: var(--color-text-muted, #52525b);
  font-weight: 600;
}

.sqlnb-result td.sqlnb-null {
  color: var(--color-text-subtle, #71717a);
  font-style: italic;
}

.sqlnb-result td.sqlnb-num {
  text-align: right;
}

/* Narrow mounts collapse the sidebar under the editor. */
@media (max-width: 560px) {
  #sqlnb-root {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }

  .sqlnb-side {
    max-height: 10em;
  }
}
  </style>
  </head>
  <body>
    <div id="sqlnb-root" role="region" aria-label="SQL notebook">
      <aside class="sqlnb-side" aria-label="Database schema">
        <div class="sqlnb-side-title">Schema</div>
        <div id="sqlnb-tables" class="sqlnb-tables">
          <div class="sqlnb-hint">waiting for engine…</div>
        </div>
      </aside>
      <section class="sqlnb-main">
        <div class="sqlnb-bar">
          <button id="sqlnb-run" type="button" title="Run (Ctrl/Cmd+Enter)">Run</button>
          <span id="sqlnb-status" class="sqlnb-status" aria-live="polite"></span>
        </div>
        <textarea
          id="sqlnb-sql"
          class="sqlnb-sql"
          rows="6"
          spellcheck="false"
          aria-label="SQL statement"
          placeholder="-- SQL goes here; Ctrl/Cmd+Enter runs it"
        ></textarea>
        <div id="sqlnb-error" class="sqlnb-error" role="alert" hidden></div>
        <div id="sqlnb-result" class="sqlnb-result">
          <div class="sqlnb-hint">no query yet</div>
        </div>
      </section>
    </div>
    <!--
      Order is load-bearing: sql-wasm.js defines the global initSqlJs that
      notebook.js calls once the wasm bytes arrive over the bridge. No
      inline JS (CSP script-src); notebook.js is the bundled controller.
    -->
    <script src="./sql-wasm.js"></script>
    <script src="./notebook.js"></script>
  </body>
</html>
