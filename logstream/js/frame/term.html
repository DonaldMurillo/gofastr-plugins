<!doctype html>
<!--
  GoFastr log stream — opaque-origin sandboxed frame document (protocol v1).

  Served same-origin at /__gofastr/plugin/logstream/term.html and loaded inside
  an <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under that sandbox:
    - the frame is an opaque origin; document.cookie / localStorage /
      sessionStorage throw, and window.parent.document is unreachable.
    - the framed CSP sets connect-src 'none': the frame can NEVER fetch the
      log. Every line arrives from the host as an unsolicited streamBatch
      event, and the frame answers each rendered batch with a streamAck —
      the ack window is the bridge's backpressure, which is the point of
      this plugin.
  Sub-resources are referenced by RELATIVE path so they resolve under the
  plugin asset route prefix regardless of the host-appended ?v= cache-buster.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Log stream</title>
    <link rel="stylesheet" href="./term.css" />
  </head>
  <body>
    <div id="logstream-root" role="region" aria-label="Log stream">
      <div class="ls-toolbar">
        <input id="ls-search" type="search" placeholder="Search scrollback"
          aria-label="Search the scrollback buffer" />
        <span id="ls-search-status" class="ls-search-status" aria-live="polite"></span>
        <span id="ls-count" class="ls-count" aria-live="polite" title="lines rendered / scrollback bound">—</span>
      </div>
      <div id="logstream-term" class="ls-term"></div>
    </div>
    <!--
      The ?v= on the iframe SRC is a host-appended cache-buster for
      term.html; sub-resource references stay relative and do not depend on
      its value. The bundle is the ONLY script: no inline JS (CSP script-src
      'self'), xterm.js and its addons are bundled in.
    -->
    <script src="./term.js"></script>
  </body>
</html>
