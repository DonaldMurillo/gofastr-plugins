name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily, for the gofastr-latest job below. Drift against the framework is
    # something that happens while nobody is looking, so something has to look.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a stray local go.work leak into a CI resolve: every job must see
  # the same modules a fresh clone does.
  GOWORK: off

jobs:
  # The root module, built the way a consumer gets it: GoFastr resolved from the
  # proxy at the version go.mod pins, not from a sibling checkout.
  # Build and test against the LATEST gofastr release, not the pinned one.
  #
  # go.mod pins a version deliberately: a cross-repo demo that floats breaks
  # without anyone touching it, and the posthog plugin sat blocked on exactly
  # that. But a pin nobody revisits is how this repo ended up two releases
  # behind (v0.71.2 against v0.73.0) without a single failing build — the pin
  # made drift invisible rather than impossible.
  #
  # This job makes drift visible. It is deliberately NOT on pull_request: a
  # third party publishing a release should not turn someone's unrelated PR
  # red. It runs on main, on a schedule, and on demand — which is enough for
  # drift to be a red build rather than a discovery months later.
  gofastr-latest:
    name: go (latest gofastr release)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Upgrade to the latest gofastr release
        run: |
          set -euo pipefail
          # Capture the whole listing, THEN take the first line. Piping
          # ls-remote into `head` closes the pipe early, git dies of SIGPIPE,
          # and under `set -o pipefail` that is exit 141 — which is how this
          # job failed on its own first run.
          tags=$(git ls-remote --tags --refs --sort=-v:refname \
            https://github.com/DonaldMurillo/gofastr.git 'v*')
          latest=$(printf '%s\n' "$tags" | sed -n '1s|.*refs/tags/||p')
          if [ -z "$latest" ]; then
            echo "::error::could not resolve the latest gofastr tag"
            exit 1
          fi
          echo "latest gofastr release: $latest"
          pinned=$(go list -m -f '{{.Version}}' github.com/DonaldMurillo/gofastr)
          echo "pinned in go.mod:       $pinned"
          if [ "$latest" = "$pinned" ]; then
            echo "already on the latest release"
          else
            echo "::notice::gofastr $latest is available; go.mod pins $pinned"
            go get "github.com/DonaldMurillo/gofastr@$latest"
          fi
      - name: Build and test against it
        run: go build ./... && go test ./... -count=1

  go:
    name: go (root module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Cheapest check, so it runs first. Scoped to TRACKED .go files rather
      # than `gofmt -l .`, which would also walk the plugins' js/node_modules
      # trees — vendored packages are not ours to reformat, and a stray .go
      # fixture in one would fail this for something nobody here can fix.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean; run: gofmt -w $unformatted"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # A committed `replace` would make the repo build only on the machine it
      # points at. This is the guard that keeps a fresh clone buildable.
      - name: no replace directives
        run: |
          if grep -qE '^\s*replace\s' go.mod; then
            echo "::error file=go.mod::go.mod contains a replace directive; use a gitignored go.work for local dev instead"
            grep -nE '^\s*replace\s' go.mod
            exit 1
          fi

      # The example suite drives a real headless Chrome via chromedp, which
      # resolves the browser from PATH by a fixed list of well-known names. This
      # job used to rely on the runner image happening to preinstall one of them;
      # that assumption broke (every run failing "chrome start (is Chrome
      # installed?): websocket url timeout reached"), and it fails as a
      # correctness error rather than an environment one, so it reads like the
      # code regressed. Install the browser explicitly instead, and assert it is
      # reachable under a name chromedp actually looks for — better to fail here,
      # loudly, than 20s into a test that appears to be about the editor.
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: chrome is on PATH under a name chromedp resolves
        run: |
          echo "setup-chrome reported: ${{ steps.setup-chrome.outputs.chrome-path }}"
          if ! command -v google-chrome >/dev/null; then
            sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/local/bin/google-chrome
          fi
          google-chrome --version

      # Also covers internal/registry, which validates plugins.json against the
      # plugin packages it claims to describe.
      - name: go test
        run: go test ./... -count=1

  # The eject build canary gets its own runner because it is the one test that
  # competes for the machine. It ejects every plugin into a temp module and
  # runs a cold `go build` over it; sharing a two-core runner with the chromedp
  # suites starved them until Chrome missed its websocket handshake, which
  # surfaces as "chrome start (is Chrome installed?)" and reads like a broken
  # browser rather than a busy box. No Chrome is installed here, and nothing
  # else runs alongside it.
  eject:
    name: eject canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Proves an ejected plugin compiles against gofastr ALONE — no
      # gofastr-plugins require survives the rewrite. This is what fails the day
      # a plugin gains an import ejection cannot resolve, or someone adds a
      # plugin without adding its embed patterns to source.go.
      - name: eject every plugin and build it standalone
        run: go test ./internal/eject/ -run TestEjectEveryPluginBuilds -count=1 -v
        env:
          GOFASTR_EJECT_BUILD: "1"

  js:
    name: ${{ matrix.plugin }} bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every plugin with a js/ directory belongs here: each commits a prebuilt
        # bundle that go:embed serves, so one left out ships stale JS silently.
        plugin: [richtext, mermaid, monaco, tour, geomap, pdf, datagrid, chart, logstream, imageedit, formbuilder, calendar, whiteboard, scanner, genui]
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}/js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/js/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present # richtext ships a test suite; monaco/tour don't (no-op)

      # Each plugin's bundle in <plugin>/assets/ is committed prebuilt and served
      # by go:embed, so a source edit without a rebuild ships stale JS/CSS that no
      # Go test would notice. Rebuilding must be a no-op on a clean tree.
      - name: bundle is up to date with its sources
        run: |
          npm run build
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- ${{ matrix.plugin }}/assets; then
            echo "::error::${{ matrix.plugin }}/assets is stale — run 'npm run build' in ${{ matrix.plugin }}/js and commit the result"
            git diff --stat -- ${{ matrix.plugin }}/assets
            exit 1
          fi

  # Journeys run in WebKit as well as Chromium on purpose: several shipped bugs
  # were Safari-only and invisible to Chrome-based tests.
  # Every demo page, both themes plus 390px, captured and uploaded.
  #
  # docs/demo-page-design.md opens with "look at all four. Not the DOM, the
  # pixels", and every visual defect this repo has shipped was found that way
  # and by nothing else — a pdf mount rendered inside its own fact-chip row, a
  # scanner whose phone viewport showed toolbars and no document, a duplicated
  # result line. All of them passed the entire test suite.
  #
  # This job cannot judge a design. It removes the excuse that looking was
  # inconvenient: the artifact is on the run, so a reviewer can see what a
  # change did to fifteen pages without checking anything out. It runs on PRs
  # for that reason — the pixels are most worth seeing while a change is still
  # a proposal.
  shots:
    name: demo screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: install
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: capture
        working-directory: e2e
        env:
          SHOTS: "1"
        run: npx playwright test demo-shots --project=shots
      - uses: actions/upload-artifact@v4
        # Uploaded even when the capture fails: a run that died halfway still
        # has the pages it managed, and a blank page is itself the finding.
        if: always()
        with:
          name: demo-screenshots
          path: e2e/shots/
          retention-days: 14

  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sharded because one serial job stopped being able to hold the suite.
        #
        # workers is 1 and fullyParallel is off (journeys share persisted demo
        # state), so a single job runs every test end to end. As plugins landed,
        # webkit — much the slower engine — passed the point where adding one
        # plugin pushed an UNRELATED journey over its timeout: imageedit and
        # whiteboard each broke logstream's flood test, and a logstream-only
        # change broke datagrid's sort test. Failures landed on whoever was
        # unlucky rather than whoever caused them, which cost several rounds of
        # looking in the wrong plugin.
        #
        # Playwright shards by file, so each shard still runs its files serially
        # and the shared-state assumption holds within a shard.
        #
        # Four rather than three: file sizes are lopsided (the editor journeys
        # dwarf everything else), and three gave 124/5/62 while four gives
        # 48/76/30/37 — the long pole drops from 190 tests to 76. Balance is
        # bounded by the largest single file, which sharding cannot split.
        # See #34.
        browser: [webkit, chromium]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: install
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: typecheck
        working-directory: e2e
        run: npm run typecheck

      - name: test
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7
