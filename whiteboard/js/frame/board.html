<!doctype html>
<!--
  GoFastr whiteboard — opaque-origin sandboxed frame document (protocol v1).

  Served same-origin at /__gofastr/plugin/whiteboard/board.html and loaded
  inside an <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under
  that sandbox:
    - the frame is an opaque origin; document.cookie / localStorage /
      sessionStorage throw, and window.parent.document is unreachable.
    - the framed CSP sets connect-src 'none': this document can NEVER open
      a connection — not fetch, not XHR, not WebSocket, not EventSource.
      Collaboration therefore cannot ride a socket in here. Instead the
      Yjs CRDT emits opaque binary update blobs over the postMessage
      bridge, and the HOST fans them out to the other participants. The
      frame collaborates with people it cannot reach.
  Sub-resources are referenced by RELATIVE path so they resolve under the
  plugin asset route prefix regardless of the host-appended ?v= cache-buster.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="./board.css" />
  </head>
  <body>
    <div id="wb-root" role="region" aria-label="Collaborative whiteboard">
      <div class="wb-toolbar" role="toolbar" aria-label="Drawing tools">
        <span class="wb-participant" id="wb-participant" title="Your participant colour, assigned by the host">
          <span class="wb-participant-swatch" id="wb-participant-swatch" aria-hidden="true"></span>
          <span id="wb-participant-label">host assigns identity</span>
        </span>
        <span class="wb-sep" aria-hidden="true"></span>
        <button type="button" id="wb-tool-pen" class="wb-btn wb-btn-on" aria-pressed="true" title="Pen">✏️<span class="wb-btn-label">Pen</span></button>
        <button type="button" id="wb-tool-eraser" class="wb-btn" aria-pressed="false" title="Eraser">🧽<span class="wb-btn-label">Erase</span></button>
        <span class="wb-sep" aria-hidden="true"></span>
        <button type="button" id="wb-size-s" class="wb-btn" aria-pressed="false" title="Thin stroke">
          <span class="wb-dot wb-dot-s" aria-hidden="true"></span>
        </button>
        <button type="button" id="wb-size-m" class="wb-btn wb-btn-on" aria-pressed="true" title="Medium stroke">
          <span class="wb-dot wb-dot-m" aria-hidden="true"></span>
        </button>
        <button type="button" id="wb-size-l" class="wb-btn" aria-pressed="false" title="Thick stroke">
          <span class="wb-dot wb-dot-l" aria-hidden="true"></span>
        </button>
        <span class="wb-status" id="wb-status" role="status" aria-live="polite">connecting…</span>
      </div>
      <div id="wb-canvas-wrap" class="wb-canvas-wrap">
        <canvas id="wb-canvas" role="img" aria-label="Shared drawing surface"></canvas>
        <div id="wb-cursors" class="wb-cursors" aria-hidden="true"></div>
      </div>
    </div>
    <!--
      The ?v= on the iframe SRC is a host-appended cache-buster for
      board.html; sub-resource references stay relative and do not depend on
      its value. The bundle is the ONLY script: no inline JS (CSP script-src),
      Yjs is bundled in.
    -->
    <script src="./board.js"></script>
  </body>
</html>
