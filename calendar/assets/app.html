<!doctype html>
<!--
  GoFastr calendar — opaque-origin sandboxed frame document (protocol v1).

  Served same-origin at /__gofastr/plugin/calendar/app.html and loaded inside
  an <iframe sandbox="allow-scripts"> (NO allow-same-origin). Under that sandbox:
    - the frame is an opaque origin; document.cookie / localStorage /
      sessionStorage throw, and window.parent.document is unreachable.
    - the framed CSP sets connect-src 'none': the frame can NEVER fetch. Every
      occurrence arrives from the host over the postMessage bridge as a
      correlated requestOccurrences → occurrencesResult pair, already resolved
      to explicit instants and wall clocks by Go. The frame renders strings;
      it never computes a recurrence and never consults a timezone.
  Sub-resources are referenced by RELATIVE path so they resolve under the
  plugin asset route prefix regardless of the host-appended ?v= cache-buster.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Calendar</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="cal-root" role="region" aria-label="Calendar">
      <div class="cal-toolbar">
        <div class="cal-nav" role="group" aria-label="Navigate dates">
          <button type="button" id="cal-prev" class="cal-btn" aria-label="Previous period">‹</button>
          <button type="button" id="cal-today" class="cal-btn">Today</button>
          <button type="button" id="cal-next" class="cal-btn" aria-label="Next period">›</button>
        </div>
        <h2 id="cal-title" class="cal-title" aria-live="polite">Loading…</h2>
        <div class="cal-views" role="group" aria-label="Switch view">
          <button type="button" id="cal-v-month" class="cal-btn cal-btn-seg" aria-pressed="false">Month</button>
          <button type="button" id="cal-v-week" class="cal-btn cal-btn-seg" aria-pressed="true">Week</button>
          <button type="button" id="cal-v-day" class="cal-btn cal-btn-seg" aria-pressed="false">Day</button>
        </div>
      </div>
      <div class="cal-zone-row">
        <span id="cal-zone" class="cal-zone"></span>
        <span id="cal-dst" class="cal-dst" hidden></span>
      </div>
      <div id="cal-view" class="cal-view" role="application" aria-label="Calendar grid — arrow keys move focus or the focused event, Enter opens an event">
        <!-- views.ts renders here -->
      </div>
      <div id="cal-status" class="cal-status" aria-live="polite"></div>
    </div>
    <!--
      The ?v= on the iframe SRC is a host-appended cache-buster for
      app.html; sub-resource references stay relative and do not depend on
      its value. The bundle is the ONLY script (CSP script-src 'self'), and
      it is hand-written: no calendar library anywhere in it.
    -->
    <script src="./app.js"></script>
  </body>
</html>
